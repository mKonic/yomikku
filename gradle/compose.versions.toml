[versions]
# Must match the highest BOM anywhere in the graph (ui-tooling pulls its own).
# A BOM that differs between the compile and runtime classpaths skews every module it
# constrains — see CheckClasspathSkewTask.
compose-bom = "2026.09.00"

[libraries]
activity = "androidx.activity:activity-compose:1.13.0"
bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
foundation = { module = "androidx.compose.foundation:foundation" }
animation = { module = "androidx.compose.animation:animation" }
animation-graphics = { module = "androidx.compose.animation:animation-graphics" }
runtime = { module = "androidx.compose.runtime:runtime" }
runtime-annotation = { module = "androidx.compose.runtime:runtime-annotation" }
ui = { module = "androidx.compose.ui:ui" }
ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
ui-util = { module = "androidx.compose.ui:ui-util" }

# KMK --> the expressive APIs the app uses only exist here. This must stay equal to the version
# the Compose Multiplatform material3 depends on (material-kolor / richeditor / aboutlibraries pull
# org.jetbrains.compose.material3, which is runtime-only and drags androidx material3 up with it).
# If it drifts below that, the compile classpath and the packaged runtime disagree and expressive
# composables die with NoSuchMethodError at first paint. :app:checkComposeClasspathSkew guards it.
material3-core = { module = "androidx.compose.material3:material3", version = "1.5.0-alpha22" }

glance = "androidx.glance:glance-appwidget:1.2.0"
colorpicker = {module = "com.github.skydoves:colorpicker-compose", version = "1.2.0"}
